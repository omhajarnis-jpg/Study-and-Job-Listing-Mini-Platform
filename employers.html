<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employers | RuralConnect</title>
  <link href="../SkillNest/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark site-navbar fixed-top" style="background: rgba(15, 23, 42, 0.95);">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-name text-success fw-bold" style="font-family: 'Playfair Display', serif; font-size: 1.6rem;">🌾 RuralConnect</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-3 align-items-center">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="jobs.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="post-job.html">Post a Job</a></li>
          <li class="nav-item"><a class="nav-link text-white active" href="employers.html">Employers</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="profile.html">Profile</a></li>
          <li class="nav-item"><a class="btn btn-outline-success btn-sm ms-2" href="../SkillNest/home.html">Learning Hub</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 mt-5">
    <div class="container text-center mb-5 mt-5">
      <h1 class="display-5 fw-bold text-dark">Empower Rural Communities</h1>
      <p class="lead text-muted">Join hands with us to bring local employment to your region.</p>
    </div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4 rounded-4 mb-5">
            <div class="card-body">
              <h2 class="text-success mb-4 text-center">Register Your Business</h2>
              
              <form class="post-job-form">
                <div class="mb-3">
                  <label for="employer-name" class="form-label fw-bold text-dark">Employer / Company Name</label>
                  <input type="text" id="employer-name" name="employer-name" class="form-control" placeholder="Enter your company or farm name" required>
                </div>

                <div class="mb-3">
                  <label for="location" class="form-label fw-bold text-dark">Location</label>
                  <input type="text" id="location" name="location" class="form-control" placeholder="Village, District" required>
                </div>

                <div class="mb-3">
                  <label for="contact" class="form-label fw-bold text-dark">Contact Email or Phone</label>
                  <input type="text" id="contact" name="contact" class="form-control" placeholder="example@email.com or 9876543210">
                </div>
                
                <div class="mb-4">
                  <label for="description" class="form-label fw-bold text-dark">About Your Company</label>
                  <textarea id="description" name="description" class="form-control" rows="5" placeholder="Briefly describe what your organization does..."></textarea>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Register</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-4 text-center text-muted mt-5" style="background: #0F172A; border-top: 1px solid rgba(255,255,255,0.1);">
    <div class="container">
      <p class="mb-0 text-white">© 2025 RuralConnect. Empowering Rural Employment.</p>
    </div>
  </footer>

  <script src="../SkillNest/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
