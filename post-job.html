<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job | RuralConnect</title>
  <link href="../SkillNest/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark site-navbar fixed-top" style="background: rgba(15, 23, 42, 0.95);">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-name text-success fw-bold" style="font-family: 'Playfair Display', serif; font-size: 1.6rem;">🌾 RuralConnect</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-3 align-items-center">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="jobs.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link text-white active" href="post-job.html">Post a Job</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="btn btn-outline-success btn-sm ms-2" href="../SkillNest/home.html">Learning Hub</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 mt-5">
    <div class="container text-center mb-5 mt-5">
      <h1 class="display-5 fw-bold text-dark">Post a Job Opportunity</h1>
      <p class="lead text-muted">Connect with skilled rural workers by posting your job details below.</p>
    </div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4 rounded-4 mb-5">
            <div class="card-body">
              <form class="post-job-form">
                <div class="mb-3">
                  <label for="job-title" class="form-label fw-bold text-dark">Job Title</label>
                  <input type="text" id="job-title" class="form-control" placeholder="e.g., Farm Supervisor" required>
                </div>

                <div class="mb-3">
                  <label for="company-name" class="form-label fw-bold text-dark">Organization / Employer Name</label>
                  <input type="text" id="company-name" class="form-control" placeholder="e.g., Green Valley Farms" required>
                </div>

                <div class="mb-3">
                  <label for="location" class="form-label fw-bold text-dark">Location</label>
                  <input type="text" id="location" class="form-control" placeholder="Village / District / State" required>
                </div>

                <div class="mb-3">
                  <label for="job-type" class="form-label fw-bold text-dark">Job Type</label>
                  <select id="job-type" class="form-select" required>
                    <option value="">Select Type</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                    <option value="Seasonal">Seasonal</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="salary" class="form-label fw-bold text-dark">Salary (optional)</label>
                  <input type="text" id="salary" class="form-control" placeholder="e.g., ₹10,000/month">
                </div>

                <!-- Lab 2: Salary Calculator (Basic Mathematical Operations) -->
                <div class="salary-calculator bg-white p-4 mb-4 border rounded-4 shadow-sm" style="border-color: #e2e8f0 !important;">
                  <h5 class="text-success fw-bold mb-3">🧮 Salary Estimator</h5>
                  <div class="row g-3 mb-3 text-start">
                    <div class="col-sm-6">
                      <label for="calc-hours" class="form-label small fw-bold">Enter Daily Wage (₹)</label>
                      <input type="number" id="calc-hours" class="form-control" placeholder="e.g., 500">
                    </div>
                    <div class="col-sm-6">
                      <label for="calc-rate" class="form-label small fw-bold">Enter Days Worked</label>
                      <input type="number" id="calc-rate" class="form-control" placeholder="e.g., 20">
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold d-block">Select Operation</label>
                    <div class="d-flex flex-wrap gap-2">
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="mathOp" id="opAdd" value="+">
                        <label class="form-check-label" for="opAdd">Add (+)</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="mathOp" id="opSub" value="-">
                        <label class="form-check-label" for="opSub">Sub (-)</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="mathOp" id="opMul" value="*" checked>
                        <label class="form-check-label" for="opMul">Mul (*)</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="mathOp" id="opDiv" value="/">
                        <label class="form-check-label" for="opDiv">Div (/)</label>
                      </div>
                    </div>
                  </div>
                  <button type="button" class="btn btn-success w-100 mb-3 fw-bold" onclick="calculateSalary()">Calculate Total Salary</button>
                  <div class="p-3 bg-light rounded border text-center">
                    <p class="mb-0 fw-bold text-dark">Estimated Result: <span id="calc-result" class="text-success fs-5">₹0</span></p>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label fw-bold text-dark">Job Description</label>
                  <textarea id="description" class="form-control" rows="5" placeholder="Describe the responsibilities and requirements..." required></textarea>
                </div>

                <div class="mb-4">
                  <label for="contact" class="form-label fw-bold text-dark">Contact Email or Phone</label>
                  <input type="text" id="contact" class="form-control" placeholder="e.g., example@gmail.com / +91 9876543210" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Submit Job Post</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-4 text-center text-muted mt-5" style="background: #0F172A; border-top: 1px solid rgba(255,255,255,0.1);">
    <div class="container">
      <p class="mb-0 text-white">© 2025 RuralConnect. Empowering Rural Communities Through Employment.</p>
    </div>
  </footer>

  <script src="../SkillNest/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Lab 2: Basic Mathematical Operations
    function calculateSalary() {
      const val1 = parseFloat(document.getElementById('calc-hours').value);
      const val2 = parseFloat(document.getElementById('calc-rate').value);
      const operation = document.querySelector('input[name="mathOp"]:checked').value;
      const resultSpan = document.getElementById('calc-result');

      if (isNaN(val1) || isNaN(val2)) {
        alert("Please enter valid numbers in both fields.");
        return;
      }

      let result = 0;
      if (operation === '+') result = val1 + val2;
      else if (operation === '-') result = val1 - val2;
      else if (operation === '*') result = val1 * val2;
      else if (operation === '/') {
        if (val2 === 0) {
          alert("Cannot divide by zero.");
          return;
        }
        result = val1 / val2;
      }

      resultSpan.textContent = '₹' + result.toLocaleString();
      
      // Auto-fill the salary input if it's a multiplication (most common for total salary)
      if (operation === '*') {
        document.getElementById('salary').value = `₹${result.toLocaleString()}`;
      }
    }
  </script>
</body>
</html>
