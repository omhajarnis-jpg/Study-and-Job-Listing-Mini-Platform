<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply for Job | RuralConnect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="top">
  <header>
    <nav>
      <h1 class="logo">RuralConnect</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Job Listings</a></li>
        <li><a href="employers.html">Employers</a></li>
      </ul>
    </nav>
  </header>

  <section class="apply-section">
    <h2>Job Application Form</h2>
    <p>Please fill out your details carefully. We’ll contact you if you’re shortlisted.</p>

    <form class="apply-form">
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full-name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@email.com" required />

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" placeholder="9876543210" required />

      <label for="job-title">Applying for</label>
      <input type="text" id="job-title" name="job-title" placeholder="Job name" required />

      <label for="experience">Experience / Skills</label>
      <textarea id="experience" name="experience" rows="5" placeholder="Describe your experience or skills" required></textarea>

      <label for="expectations">Salary Expectations</label>
      <input type="text" id="expectations" name="expectations" placeholder="e.g., ₹10,000 per month" />

      <button type="submit" class="apply-btn">Submit Application</button>
    </form>
  </section>

  <footer>
    <p>© 2025 RuralConnect | Empowering Rural Employment</p>
  </footer>
</body>
</html>
