<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | RuralConnect</title>
  <link href="../SkillNest/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark site-navbar fixed-top" style="background: rgba(15, 23, 42, 0.95);">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-name text-success fw-bold" style="font-family: 'Playfair Display', serif; font-size: 1.6rem;">🌾 RuralConnect</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-3 align-items-center">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="jobs.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link text-white active" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="login.html">Login</a></li>
          <li class="nav-item"><a class="btn btn-outline-success btn-sm ms-2" href="../SkillNest/home.html">Learning Hub</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 mt-5">
    <div class="container text-center mb-5 mt-5">
      <h1 class="display-5 fw-bold text-dark">Create an Account</h1>
      <p class="lead text-muted">Join RuralConnect to find jobs or hire talent in your community.</p>
    </div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card border-0 shadow-sm p-4 rounded-4 mb-5">
            <div class="card-body">
              <form id="register-form">
                <div class="mb-3">
                  <label class="form-label fw-bold text-dark">Full Name</label>
                  <input type="text" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark">Email</label>
                  <input type="email" id="reg-email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark">Phone Number</label>
                  <input type="text" id="reg-phone" class="form-control" placeholder="Enter 10-digit phone number" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark">Password</label>
                  <input type="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-bold text-dark">Confirm Password</label>
                  <input type="password" class="form-control" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Register</button>
                <p class="mt-3 text-center text-muted">Already have an account? <a href="login.html" class="text-success fw-bold text-decoration-none">Login here</a></p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-4 text-center text-muted mt-5" style="background: #0F172A; border-top: 1px solid rgba(255,255,255,0.1);">
    <div class="container">
      <p class="mb-0 text-white">© 2025 RuralConnect. Empowering Rural Communities Through Employment.</p>
    </div>
  </footer>

  <script src="../SkillNest/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Lab 6: Form Validation with Regular Expressions
    document.getElementById('register-form').addEventListener('submit', function(e) {
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;

      const phoneRegex = /^[789]\d{9}$/; // Validates 10-digit Indian numbers
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailRegex.test(email)) {
        e.preventDefault();
        alert("Email Validation Failed: Please enter a valid email address (e.g., name@example.com).");
        return;
      }

      if (!phoneRegex.test(phone)) {
        e.preventDefault();
        alert("Phone Validation Failed: Must be 10 digits and start with 7, 8, or 9.");
        return;
      }

      // If valid, show success and simulate redirect
      e.preventDefault();
      alert("Registration Successful! Welcome to RuralConnect.");
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
